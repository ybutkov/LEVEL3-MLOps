[project]
name = "bike-rental"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.12.21",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandera>=0.31.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "mlflow>=3.13.0",
    "lakefs-spec>=0.14.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.42.0",
    "httpx>=0.28.1",
    "s3fs>=2026.4.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "ruff",
    "ipykernel>=7.2.0",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "bike_rental"
registry_modules = ["bike_rental.components.*"]
