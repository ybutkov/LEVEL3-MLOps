# Env-invariant data layout under the data root. Same on every stand.
layout:
  source:     raw
  processed:  processed
  quarantine: quarantine

# MLflow tracking/registry. 
# tracking_uri
# experiment/model names 
# defaults to the shared stand and can be overridden per {stand}.yaml.
mlflow:
  tracking_uri:     http://161.97.89.177:5000
  experiment_name:  hourly_rental_demand
  registered_model: total_rentals_regressor

# LakeFS source (non-secret). host is stand-specific; credentials via env
# (LAKEFS_ACCESS_KEY / LAKEFS_SECRET_KEY)
lakefs:
  host:          http://161.97.89.177:8000
  repo:          bike-rental
  read_ref:      main        # pipeline reads raw from here (pinnable to a commit/tag)
  merge_into:    main        # writable trunk: ingest + dataset snapshots merge here
  raw_prefix:    raw
  ingest_branch: ingest
