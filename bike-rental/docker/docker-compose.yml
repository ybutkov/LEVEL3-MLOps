name: mlops

services:
  postgres:
    image: postgres:16
    container_name: mlops_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./pgdata_final:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2023-05-18T00-05-36Z
    container_name: mlops_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./miniodata_final:/data

  minio-setup:
    image: minio/mc:RELEASE.2023-05-18T16-59-00Z
    container_name: mlops_minio_setup
    depends_on:
      - minio
    environment:
      - MC_HOST_minio=http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc mb -p minio/industrial_chall minio/mlflow
        exit 0

  lakefs:
    image: treeverse/lakefs:latest
    container_name: mlops_lakefs
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      - LAKEFS_DATABASE_TYPE=postgres
      - LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING=postgres://postgres:postgres@postgres/postgres?sslmode=disable
      - LAKEFS_BLOCKSTORE_TYPE=s3
      - LAKEFS_BLOCKSTORE_S3_ENDPOINT=http://minio:9000
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID=minioadmin
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY=minioadmin
      - LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE=true
      - LAKEFS_AUTH_ENCRYPT_SECRET_KEY=super-secret-key-at-least-32-chars

  mlflow:
    # Здесь мы используем встроенную сборку (заменяет 2 файла на 1)
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/mlflow/mlflow:v3.13.0
        RUN pip install --no-cache-dir psycopg2-binary boto3
    container_name: mlops_mlflow
    ports:
      - "5000:5000"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_TRACKING_AUTH_DISABLED=true
      - MLFLOW_AUTH_CONFIG_PATH=""
    # --artifacts-destination s3://mlflow/  - should we point to destination?
    command: >
      mlflow server 
      --backend-store-uri postgresql+psycopg2://postgres:postgres@postgres/postgres
      --artifacts-destination s3://mlflow/ 
      --host 0.0.0.0 
      --port 5000
      --allowed-hosts '*'
